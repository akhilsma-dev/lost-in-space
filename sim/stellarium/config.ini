; Stellarium 26.3 user config for the star-tracker test set (see ml/out/stellarium_eval.md).
; Used via:  stellarium --user-dir <dir containing this file>   (sim/stellarium_capture.py does this)
[main]
version                             = 26.3
invert_screenshots_colors           = false
screenshot_custom_size              = true
screenshot_custom_width             = 1920
screenshot_custom_height            = 1080
screenshot_format                   = png
screenshot_datetime_filename        = false

[plugins_load_at_startup]
RemoteControl                       = false
Oculars                             = false
Satellites                          = false
Exoplanets                          = false
MeteorShowers                       = false
Novae                               = false
FOV                                 = false
SolarSystemEditor                   = false


[video]
fullscreen                          = false
screen_w                            = 1280
screen_h                            = 720
screen_x                            = 40
screen_y                            = 40

[projection]
type                                = ProjectionPerspective
viewportMask                        = none
flip_horz                           = false
flip_vert                           = false

[localization]
sky_culture                         = modern
sky_locale                          = en
app_locale                          = en

[search]
flag_search_online                  = false

[stars]
relative_scale                      = 1.0
absolute_scale                      = 1.0
flag_star_twinkle                   = false
star_twinkle_amount                 = 0.0
labels_amount                       = 0.0
init_bortle_scale                   = 1

[gui]
auto_hide_horizontal_toolbar        = true
auto_hide_vertical_toolbar          = true
flag_mouse_cursor_timeout           = true
mouse_cursor_timeout                = 0

[navigation]
startup_time_mode                   = Preset
preset_sky_time                     = 2451545.0
init_fov                            = 50
init_view_pos                       = 1,0,0
auto_move_duration                  = 0.0
viewing_mode                        = equator

[landscape]
flag_landscape                      = false
flag_fog                            = false
flag_atmosphere                     = false
flag_enable_labels                  = false
flag_landscape_sets_location        = false

[viewing]
flag_constellation_drawing          = false
flag_constellation_name             = false
flag_constellation_art              = false
flag_constellation_boundaries       = false
flag_azimuthal_grid                 = false
flag_equatorial_grid                = false
flag_equatorial_J2000_grid          = false
flag_ecliptic_grid                  = false
flag_galactic_grid                  = false
flag_cardinal_points                = false
flag_horizon_line                   = false
flag_meridian_line                  = false
flag_night                          = false
light_pollution_luminance           = 0.0
use_luminance_adaptation            = true

[astro]
flag_stars                          = true
flag_star_name                      = false
flag_planets                        = true
flag_planets_hints                  = false
flag_planets_labels                 = false
flag_planets_markers                = false
flag_planets_pointers               = false
flag_planets_orbits                 = false
flag_nebula                         = true
flag_nebula_name                    = false
nebula_hints_amount                 = 0.0
nebula_labels_amount                = 0.0
labels_amount                       = 0.0
flag_milky_way                      = true
milky_way_intensity                 = 1
milky_way_saturation                = 1
flag_star_magnitude_limit           = false
flag_aberration                     = false

[init_location]
location                            = Greenwich, United Kingdom
landscape_name                      = zero

[scripts]
flag_script_allow_write_absolute_path = true
flag_allow_screenshots_dir           = true
